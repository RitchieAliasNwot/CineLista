<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>CineLista - Estadisticas</title>
    <th:block th:replace="~{fragments/cabecera :: comunes}"></th:block>
    <th:block th:replace="~{fragments/cabecera :: datatables}"></th:block>
    <th:block th:replace="~{fragments/cabecera :: datatables-buttons}"></th:block>
    <style>
        nav a:nth-child(4) {
            background: #FF914D;
            color: #172A46;
        }
    </style>
</head>

<body>

    <div th:replace="~{fragments/nav :: nav}"></div>
    <main>

        <h1>ESTADÍSTICAS</h1>

        <!--
  TODO:
  1) Comprobar jQuery y DataTables (CDN o local) ya agregadas
  2) Inicializad DataTables sobre la tabla de abajo con la opcion "ajax"
     apuntando a GET /api/estadisticas (endpoint que crearéis vosotros
     en el controlador EstadisticasController).
     3) Id completando: buscador, footerCallback con el total, columna con
     barra grafica, boton de exportar a CSV con nombre propio.
     -->
        <script>
            $(document).ready(function () {
                $('#tabla-estadisticas').DataTable({
                    ajax: {
                        url: '/api/estadisticas',
                        dataSrc: '' // el JSON es directamente un array, sin envoltorio {data: [...]}
                    },
                    columns: [
                        { data: 'titulo' },
                        { data: 'genero' },
                        { data: 'taquilla' },
                        { data: 'nota' }
                    ]
                });
            });
        </script>
        <table id="tabla-estadisticas">
            <thead>
                <tr>
                    <th>Título</th>
                    <th>Género</th>
                    <th>Taquilla</th>
                    <th>Nota</th>
                </tr>
            </thead>
            <tbody>
                <!-- Las filas las rellenara DataTables via ajax -->
            </tbody>
            <tfoot>
                <tr>
                    <th></th>
                    <th></th>
                    <th></th>
                    <th></th>
                </tr>
            </tfoot>
        </table>
    </main>

</body>

</html>
