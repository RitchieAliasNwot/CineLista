<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
   <title>CineLista - Estrenos</title>
   <th:block th:replace="~{fragments/cabecera :: comunes}"></th:block>
   <th:block th:replace="~{fragments/cabecera :: react}"></th:block>

   <style>
      nav a:nth-child(3) {
         background: #FF914D;
         color: #172A46;
      }
   </style>
   <script type="text/babel" src="js/componentes/TarjetaEstreno.js"></script>
   <script type="text/babel" src="js/estrenos.js"></script>
</head>

<body>

   <div th:replace="~{fragments/nav :: nav}"></div>
   <main>

      <h1>ESTRENOS</h1>

      <!--
      TODO:
      1) Comprobad los <script> de React, ReactDOM y Babel Standalone (CDN) estan
         agregados.
         2) Cargad tambien /js/componentes/TarjetaEstreno.js y /js/estrenos.js
         (ambos con type="text/babel").
         3) estrenos.js debe montar un <TarjetaEstreno> por cada estreno que llegue
            desde GET /api/estrenos, dentro de la lista de abajo.

            La lista HTML donde debe montarse cada tarjeta ya tiene el id esperado:
            -->
      <ul id="lista-estrenos">
         <tr th:each="e : ${estrenos}">
            <td th:text="${e.titulo}">Titulo</td>
            <td th:text="${e.fechaEstreno}">FechaEstreno</td>
            <td th:text="${e.genero}">Genero</td>
            <td th:text="${e.plataforma}">Plataforma</td>
            <td th:text="${e.estado}">Estado</td>
            <td>
               <span th:each="i : ${#numbers.sequence(1, 5)}" th:text="${i <= e.valoracion ? '★' : '☆'}"></span>
            </td>
         </tr>
      </ul>
   </main>

</body>

</html>
